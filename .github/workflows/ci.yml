name: Test and security scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test-and-security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Create report directory
        run: mkdir -p reports

      - name: Run Bandit SAST
        run: bandit -r app -c pyproject.toml -f html -o reports/bandit.html

      - name: Run pip-audit SCA
        run: pip-audit --cache-dir .pip-audit-cache --requirement requirements.txt --format json --output reports/pip-audit.json

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          if-no-files-found: warn
